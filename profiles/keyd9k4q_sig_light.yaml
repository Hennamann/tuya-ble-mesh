name: "Tuya G4 Smart LED (SIG Mesh)"
model: "G4-Smart-LED"
category: "dj"
# mesh_category omitted: this is a Bluetooth SIG Mesh device, not a Telink-mesh
# vendor category. The Telink loader's mesh_category field doesn't apply.
product_id: "keyd9k4q"
transport: "sig_mesh"
capabilities:
  - power
  - color_brightness
  - rgb_color
  - work_mode
data_points:
  20:
    name: "switch_led"
    type: "bool"
    description: "Light on/off"
  21:
    name: "work_mode"
    type: "enum"
    range: [0, 3]
    description: "0=white, 1=colour, 2=scene, 3=music"
  28:
    name: "bright_value_v2"
    type: "value"
    range: [10, 1000]
    description: "Brightness (v2 range)"
  30:
    name: "colour_data_v2"
    type: "string"
    description: "12-char ASCII hex: HHHHSSSSVVVV (hue 0-360, sat 0-1000, val 0-1000)"
sig_mesh:
  vendor_opcode: "0xCAD007"
  vendor_model_cid: "0x07D0"
